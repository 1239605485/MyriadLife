name: Build Android ARM64 Mod

on:
  push:
    branches: ["main", "master"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Install NDK and CMake
        shell: bash
        run: |
          sdkmanager "platform-tools" "platforms;android-21" "ndk;27.2.12479018" "cmake;3.22.1"
          sudo apt-get update
          sudo apt-get install -y ninja-build zip

      - name: Locate Android toolchain
        shell: bash
        run: |
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/27.2.12479018" >> "$GITHUB_ENV"
          echo "ANDROID_CMAKE_HOME=$ANDROID_SDK_ROOT/cmake/3.22.1" >> "$GITHUB_ENV"

      - name: Configure
        shell: bash
        run: |
          "$ANDROID_CMAKE_HOME/bin/cmake" -S . -B build-arm64 -G Ninja \\
            -DCMAKE_BUILD_TYPE=Release \\
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake" \\
            -DANDROID_ABI=arm64-v8a \\
            -DANDROID_PLATFORM=android-21

      - name: Build
        shell: bash
        run: |
          "$ANDROID_CMAKE_HOME/bin/cmake" --build build-arm64 --config Release

      - name: Verify ARM64 library
        shell: bash
        run: |
          test -s build-arm64/libMyriadLife.so
          "$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf" -h build-arm64/libMyriadLife.so | grep -q 'AArch64'

      - name: Assemble package
        shell: bash
        run: |
          mkdir -p package/Resources/lib
          cp Info.json Manifest.json MyriadLife.json package/
          cp build-arm64/libMyriadLife.so \\
            package/Resources/lib/libMyriadLife.android.arm64.so
          cd package
          zip -r ../MyriadLife-android-arm64.zip .

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: MyriadLife-android-arm64
          path: MyriadLife-android-arm64.zip
